# Synthetic profile fixture for parser and guard behavior.
workbench:
  schema: 1
  archetypes: [physics]
  activation: "bash -ic '<cmd>'   # Solver environment lives in ~/.bashrc; check command -v qcc"
  git: read-only
  user_executed:
    - {pattern: '^\s*\./[a-z_]+(\s|$)', why: "case binaries are solver runs (project policy)"}
    - {pattern: '\b(mpirun|mpiexec)\b', why: "MPI runs are user-executed (project policy)"}
  agent_allowed:
    - 'bash tools/check_framework.sh'
    - 'python3 -I tools/analytic/selfcheck.py'
    - 'python3 -I tools/check_gates.py'
    - 'bash tools/event_order.sh'
    - {pattern: 'bash compile.sh', when: "compile only; no binary execution"}
  frozen_paths: [reference/, docs/archive/]
  authority:
    rules: {path: docs/rules/, id: "R<n>-<m>"}
    gates: docs/tests/Test_Matrix.md
    audit: docs/audit/
    plans: docs/plans/
    roadmap: docs/Roadmap.md
  codex_delegation: print-only
