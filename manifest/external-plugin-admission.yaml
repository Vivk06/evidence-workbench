schema_version: 2
scope: External plugins, MCP servers, skills and CLIs considered for the evidence-workbench marketplace
status: current 2026-11-17
research_record: Historical review retained in the private archive; recorded sources and revisions appear below
extraction_record: Bundled material records its source revision and license in local notices
archetypes: [physics, code, research]
decisions: [dependency, bundle, recommend, borrow, reject]
default: reject
rules:
  archetype_scoped: "Admit a tool only for the archetypes (physics, code, research) whose work it directly serves. A recommendation names its archetypes; repo-setup proposes it only for repositories with a matching profile."
  free_only: "Admit only tools whose useful operation is free: open source and local, or a free API with no paid tier or metered vendor quota gating normal use."
  default_reject: "Anything not listed here with a non-reject decision is rejected."
  no_metered_usage: "Reject any tool or feature that spends metered usage, needs a paid tier, or depends on a rate-limited or capped quota tied to the user's accounts (model calls beyond the agent already running, vendor APIs with usage caps, CI minutes); no exceptions."
  no_redistribution_without_license: "Bundle or copy files only from a tool with a license that allows it; otherwise install it from upstream or reject it."
  user_executed_installs: "Installing, enabling, logging in or authorizing any tool is a user-executed action; the agent prints the command."
  project_permissions: "Tools follow project permissions. Writes outside the requested project need explicit authorization."
evidence_required: [source URL, exact revision or version, license from the repository's own license file, cost model, what it adds over existing skills, always-on token cost, hooks MCP network and credential exposure, project permissions and data boundaries, Codex availability, decision and reason]
tools:
  research-papers:
    decision: recommend
    archetypes: [research]
    source: https://github.com/ctoth/research-papers-plugin
    revision: fa13501acba09b06652055a0a0e7415c69ec4e07
