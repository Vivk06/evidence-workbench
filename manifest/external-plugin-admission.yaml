    license: MIT
    reason: Flesch-style scores are a weak guide for technical text and the plugin needs Node.js; the plain-language checker measures sentence and paragraph length directly. textstat (MIT, https://github.com/textstat/textstat at 5679e7ccc0c2627bca1c0506eae1a7feb802a163) rejected for the same reason.
