    license: MIT
    reason: Free local prose linter; recommend only in repositories that already keep a .vale.ini. Use the vale command directly - no MCP server is needed, and theletterf/vale-mcp-server has moved to ChrisChinchilla/Vale-MCP and is not published to npm. vale-cli/agent-tools rejected - its CMS calls return 401 without a paid subscription.
